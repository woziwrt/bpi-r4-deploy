# Builds the BPI-R4 Lite (MT7987A) with ./build.sh bpi-r4-lite standard.
# A separate workflow on purpose: a Lite failure never blocks the BPI-R4
# releases, and this one only ever touches the release-lite-standard tag.
# The upstream revisions come from pins.conf; the dispatch inputs
# openwrt_commit/mtk_commit override them for a trial build.
# The images are always kept as a workflow artifact for 14 days; they replace
# the public release only when "publish" is ticked.
name: Build BPI-R4 Lite

on:
  workflow_dispatch:
    inputs:
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''
      openwrt_commit:
        description: 'OpenWrt commit hash (leave empty to use pins.conf)'
        required: false
        default: ''
      mtk_commit:
        description: 'MTK SDK commit hash (leave empty to use pins.conf)'
        required: false
        default: ''
      publish:
        description: 'Publish to release-lite-standard (unchecked: images only as a workflow artifact)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Load build versions
        run: |
          grep -v '^\s*#' pins.conf | grep -v '^\s*$' >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.openwrt_commit }}" ] && echo "OPENWRT_COMMIT=${{ github.event.inputs.openwrt_commit }}" >> $GITHUB_ENV || true
          [ -n "${{ github.event.inputs.mtk_commit }}" ] && echo "MTK_COMMIT=${{ github.event.inputs.mtk_commit }}" >> $GITHUB_ENV || true

      - name: Runner hardware
        run: |
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'; free -g | head -2

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Build
        run: ./build.sh bpi-r4-lite standard

      - name: Prepare release artifacts
        run: |
          FILOGIC="openwrt/bin/targets/mediatek/filogic"
          P="$FILOGIC/openwrt-mediatek-filogic-bananapi_bpi-r4-lite"
          mkdir -p rel-lite
          # SD card image: it also carries the NAND/NOR/eMMC bootloaders and
          # the production image for the U-Boot "install to NAND" menu entry
          # (eMMC is then installed from the NAND U-Boot menu).
          for f in sdcard.img.gz squashfs-sysupgrade.itb \
                   emmc-preloader.bin emmc-bl31-uboot.fip \
                   snand-preloader.bin snand-bl31-uboot.fip \
                   nor-preloader.bin nor-bl31-uboot.fip; do
            if [ -f "$P-$f" ]; then
              cp "$P-$f" rel-lite/
            else
              echo "missing: $P-$f"
              [ "$f" = sdcard.img.gz ] || [ "$f" = squashfs-sysupgrade.itb ] && exit 1
            fi
          done
          cp "$FILOGIC/config.buildinfo" rel-lite/
          (cd rel-lite && sha256sum openwrt-* > sha256sums)
          ls -la rel-lite

      - name: Check the R4-only files are not in the image
        run: |
          # The BPI-R4 install scripts write MT7988 bootloaders and the LED
          # fix programs the MT7988 switch; neither may run on a Lite.
          # openwrt/files is what build.sh puts into the image on top of the
          # packages (common/files + boards/bpi-r4-lite/files).
          ROOT=openwrt/files
          find "$ROOT" -type f | sort
          bad=0
          for f in root/install-dir etc/init.d/mtk-led-fix \
                   etc/uci-defaults/94-port-led-names etc/uci-defaults/95-mtk-led-fix-enable; do
            if [ -e "$ROOT/$f" ]; then echo "R4-only file in the Lite image: $f"; bad=1; fi
          done
          [ $bad = 0 ]

      - name: Upload images as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-bpi-r4-lite-standard
          path: rel-lite/
          if-no-files-found: error
          retention-days: 14

      - name: Delete existing release-lite-standard
        if: github.event.inputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'release-lite-standard';
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            for (const rel of releases.data) {
              if (rel.tag_name === tag) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id })
                  .catch(e => console.log(`Failed to delete release ${rel.id}: ${e.message}`));
              }
            }
            await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` })
              .catch(e => console.log(`Failed to delete tag ${tag}: ${e.message}`));
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-lite-standard
        if: github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-lite-standard
          name: "BPI-R4 Lite standard WiFi (latest)"
          body: |
            Board: BPI-R4 Lite (MT7987A) | Variant: standard (WiFi, BE14)
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-lite/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
