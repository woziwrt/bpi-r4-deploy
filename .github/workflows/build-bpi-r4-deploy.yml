name: Build BPI-R4 Deploy

on:
  workflow_dispatch:
    inputs:
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENWRT_COMMIT: "99211b26fb3b9ed71d065a1fa35ce54a0d883944"
  MTK_COMMIT: "dbf10418baf257033cf4c590f098db1022496dc6"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Set build variables
        run: |
          echo "RELEASE_TAGS=release-4gb-poe-wifi" >> $GITHUB_ENV

      - name: Delete existing releases and tags
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tags = process.env.RELEASE_TAGS.split(' ');

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            for (const tag of tags) {
              for (const rel of releases.data) {
                if (rel.tag_name === tag) {
                  await github.rest.repos.deleteRelease({
                    owner,
                    repo,
                    release_id: rel.id
                  }).catch(e => console.log(`Failed to delete release ${rel.id}: ${e.message}`));
                }
              }
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`
              }).catch(e => console.log(`Failed to delete tag ${tag}: ${e.message}`));
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Restore repository cache
        id: cache-repos
        uses: actions/cache@v4
        with:
          path: |
            repo-cache/openwrt.tar.gz
            repo-cache/mtk-openwrt-feeds.tar.gz
          key: repos-${{ env.OPENWRT_COMMIT }}-${{ env.MTK_COMMIT }}

      - name: Clone and cache repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: |
          mkdir -p repo-cache

          git clone --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt-clone
          cd openwrt-clone && git checkout ${{ env.OPENWRT_COMMIT }} && cd ..
          tar -czf repo-cache/openwrt.tar.gz openwrt-clone
          rm -rf openwrt-clone

          git clone --branch master https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds mtk-clone
          cd mtk-clone && git checkout ${{ env.MTK_COMMIT }} && cd ..
          tar -czf repo-cache/mtk-openwrt-feeds.tar.gz mtk-clone
          rm -rf mtk-clone

      - name: Run builder script
        run: |
          chmod +x ./builder.sh
          ./builder.sh
        env:
          OPENWRT_COMMIT: ${{ env.OPENWRT_COMMIT }}
          MTK_COMMIT: ${{ env.MTK_COMMIT }}

      - name: Debug - List built files
        run: |
          echo "=== Contents of openwrt/bin/targets/mediatek/filogic ==="
          ls -la openwrt/bin/targets/mediatek/filogic/ || echo "Directory not found!"
          echo ""
          echo "=== Looking for bpi-r4-poe files ==="
          find openwrt/bin -name "*bpi*r4*poe*" 2>/dev/null || echo "No matching files found"
          echo ""
          echo "=== All .itb files ==="
          find openwrt/bin -name "*.itb" 2>/dev/null || echo "No .itb files found"
          echo ""
          echo "=== All .bin files ==="
          find openwrt/bin -name "*.bin" 2>/dev/null | head -20

      - name: Prepare release artifacts
        run: |
          FILOGIC="openwrt/bin/targets/mediatek/filogic"

          # Prepare artifact directory for one release tag
          mkdir -p rel-4gb-poe-wifi
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-poe-squashfs-sysupgrade.itb" \
             "rel-4gb-poe-wifi/bpi-r4-poe.itb"
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-poe-nvme-img.bin" \
             "rel-4gb-poe-wifi/"
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-poe-sdcard.img.gz" \
             "rel-4gb-poe-wifi/"
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-poe-emmc-img.bin" \
             "rel-4gb-poe-wifi/"
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-poe-snand-img.bin" \
             "rel-4gb-poe-wifi/"
          cp "${FILOGIC}/config.buildinfo" "rel-4gb-poe-wifi/"
          cd rel-4gb-poe-wifi
          sha256sum bpi-r4-poe.itb *.bin *.gz config.buildinfo > sha256sums
          cd ..

          # SD rescue image
          cp rescue/bpi-r4-rescue-sdcard.img.gz "rel-4gb-poe-wifi/"

      - name: Publish release-4gb-poe-wifi
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-poe-wifi
          name: "BPI-R4 4GB PoE WiFi (latest)"
          body: |
            Variant: 4GB RAM | PoE | WiFi (standard)
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-poe-wifi/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
